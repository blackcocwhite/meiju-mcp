name: 兼容性报告 / Compatibility report
description: 报告脱敏的登录、状态读取或控制兼容性结果。
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 docs/compatibility.md。Python 的离线测试与先前 Swift 的实机记录必须分开。
        不要粘贴手机号、SMS/captcha、token、登录链接、设备 ID/SN、家庭 ID、原始响应、截图、APK 或反编译全文。
        安全漏洞请使用 SECURITY.md 中的报告流程。
        Use synthetic or reviewed, redacted data only. Never attach credentials or personal device identifiers.
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查 / Privacy check
      options:
        - label: 我确认报告不含个人账号、设备标识、凭据、原始响应或敏感附件。
          required: true
  - type: input
    id: version
    attributes:
      label: 项目版本或提交号 / Version or commit
      placeholder: "0.2.0 或提交 SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统与 Python / OS and Python
      placeholder: "操作系统版本；Python 版本（不要填写本机用户路径）"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI 客户端与连接方式 / AI client and transport
      placeholder: "客户端及版本；本地 stdio"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 公开产品型号、类型与 profile / Public model, type, profile
      description: 可填写通用产品型号；不要填写设备 ID、SN 或家庭名称。
      placeholder: "通用型号（可选）；0xAC；generic_ac_lua_v1"
  - type: dropdown
    id: evidence
    attributes:
      label: 本次证据类型 / Evidence type
      options:
        - 仅 Python 离线 mock / Python offline mocks only
        - Python 真实登录或只读 / Python live login or read only
        - Python 真实控制与回读 / Python live control and readback
        - 先前 Swift 记录 / Earlier Swift evidence
        - 尚未成功运行 / Could not start
    validations:
      required: true
  - type: textarea
    id: operations
    attributes:
      label: 各步骤结果 / Results by operation
      description: 分别填写未执行、成功、失败或不确定。不要把请求被接受等同于物理执行。
      value: |
        登录 / Login:
        设备列表 / Device listing:
        状态读取 / Status read:
        控制写入（具体字段） / Control fields:
        回读及与目标值是否一致 / Readback and match:
        人工观察到的空调实际变化（未观察则填写未知） / Physical observation, or unknown:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现与预期 / Minimal reproduction and expectation
      description: 使用合成 ID，说明步骤、预期、实际行为及脱敏错误类别。不要贴完整配置或真实响应。
    validations:
      required: true
