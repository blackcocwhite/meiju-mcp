name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv on Linux
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v6
      - name: Install locked development dependencies
        if: runner.os == 'Linux'
        run: uv sync --frozen --group dev
      - name: Check Python source
        if: runner.os == 'Linux'
        run: uv run --frozen ruff check .
      - name: Run offline tests on Linux
        if: runner.os == 'Linux'
        run: uv run --frozen pytest
      - name: Install package and test dependencies
        if: runner.os != 'Linux'
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=1,<2"
      - name: Run offline tests on macOS and Windows
        if: runner.os != 'Linux'
        run: python -m pytest
      - name: Build source and wheel distributions
        if: runner.os == 'Linux' && matrix.python == '3.11'
        run: uv build
