name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Install locked development dependencies
        run: uv sync --frozen --group dev
      - name: Check Python source
        if: runner.os == 'Linux' && matrix.python == '3.11'
        run: uv run --frozen ruff check .
      - name: Run offline tests
        run: uv run --frozen pytest
      - name: Build source and wheel distributions
        if: runner.os == 'Linux' && matrix.python == '3.11'
        run: uv build

  go-tests:
    name: Go offline / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      MEIJU_TEST_NO_NATIVE_VAULT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-runtime/go.mod
          cache-dependency-path: go-runtime/go.sum
      - name: Test with race detector
        working-directory: go-runtime
        run: go test -race ./...
      - name: Vet Go sources
        working-directory: go-runtime
        run: go vet ./...
      - name: Cross-compile service and helper
        if: runner.os == 'Linux'
        working-directory: go-runtime
        shell: bash
        run: |
          mkdir -p ../.local/cross
          for target in linux windows; do
            suffix=""
            if [ "$target" = windows ]; then suffix=.exe; fi
            GOOS="$target" GOARCH=amd64 CGO_ENABLED=0 go build -o "../.local/cross/meiju-mcp-$target$suffix" ./cmd/meiju-mcp
            GOOS="$target" GOARCH=amd64 CGO_ENABLED=0 go build -o "../.local/cross/meiju-vault-helper-$target$suffix" ./cmd/meiju-vault-helper
          done

  swift-and-shared-service:
    name: macOS Swift + synthetic shared service
    runs-on: macos-15
    env:
      MEIJU_TEST_NO_NATIVE_VAULT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-runtime/go.mod
          cache-dependency-path: go-runtime/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked verification dependencies
        run: uv sync --frozen --group dev
      - name: Build isolated service and synthetic harness
        run: |
          mkdir -p .local/bin .cache/fixed-helper-candidate
          go -C go-runtime build -trimpath -o "$PWD/.local/bin/meiju-mcp-go" ./cmd/meiju-mcp
          go -C go-runtime build -trimpath -o "$PWD/.cache/fixed-helper-candidate/offline-harness" ./cmd/offline-harness
      - name: Compile native helper and test mock backend without Keychain
        run: |
          go-runtime/vault-helper/macos/build.sh test
          go-runtime/vault-helper/macos/build.sh stage
          python3 go-runtime/vault-helper/install.py
      - name: Build read-only Swift App with synthetic connector
        run: |
          swift --version
          MEIJU_TEST_OUTPUT_DIR="$PWD/.cache/fixed-helper-candidate" \
          MEIJU_TEST_CONNECTOR="$PWD/.cache/fixed-helper-candidate/offline-harness" \
          MEIJU_TEST_SESSION_DIR="$PWD/.local/synthetic-default" \
          go-runtime/scripts/build-swift-test.sh
      - name: Verify protocol, Swift reads, profile migration and restart
        run: uv run --frozen python go-runtime/scripts/fixed_helper_acceptance.py
